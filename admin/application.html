<!doctype html>
<html lang="hi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Details | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8fd}.head{background:#0b1830;color:#fff;padding:16px 0}.head .container{display:flex;justify-content:space-between;align-items:center}.main{padding:30px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #e4eaf3;border-radius:18px;padding:22px}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #edf1f6;font-size:13px}.label{color:#718096}.status{padding:5px 10px;border-radius:99px;background:#fff3d6;color:#946200;font-size:11px;font-weight:800}.doc{padding:13px;border:1px solid #e4eaf3;border-radius:11px;margin:9px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn-ok{background:#e7f8ef;color:#16704c}.btn-danger{background:#ffe9ec;color:#b42318}.remark{width:100%;min-height:80px;padding:10px;border:1px solid #d8e0eb;border-radius:9px;font:inherit;margin:12px 0}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head>
<body><header class="head"><div class="container"><strong>JANSUVIDA Admin</strong><button class="btn btn-light" onclick="location.href='index.html'">← Admin Dashboard</button></div></header>
<main class="main"><div class="container"><span class="eyebrow">Application Management</span><h1 id="title">Application Details</h1><div class="grid"><section class="panel"><h2>Applicant Details</h2><div id="details"></div><textarea id="remarks" class="remark" placeholder="Admin remark..."></textarea><div class="actions"><button class="btn btn-light" onclick="setStatus('processing')">Processing</button><button class="btn btn-ok" onclick="setStatus('approved')">✓ Approve</button><button class="btn btn-danger" onclick="setStatus('rejected')">✕ Reject</button><button class="btn btn-light" onclick="setStatus('completed')">Completed</button></div></section><section class="panel"><h2>Payments</h2><div id="payments"></div><h2 style="margin-top:24px">Documents</h2><div id="docs"></div></section></div></div></main>
<script>
const API_BASE=window.JANSUVIDA_API_BASE||'/api';const no=new URLSearchParams(location.search).get('no');
function token(){return localStorage.getItem('jansuvida_admin_token')||localStorage.getItem('admin_access_token')||localStorage.getItem('jansuvida_token')}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};const t=token();if(t)headers.Authorization=`Bearer ${t}`;const r=await fetch(API_BASE+path,{...opt,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!no){document.getElementById('title').textContent='Application Number जरूरी है';return}try{const d=await api(`/admin/applications/${encodeURIComponent(no)}`);const a=d.application;document.getElementById('title').textContent=a.application_no;document.getElementById('details').innerHTML=`<div class="row"><span class="label">Customer</span><b>${esc(a.customer_name)}</b></div><div class="row"><span class="label">Mobile</span><b>${esc(a.mobile)}</b></div><div class="row"><span class="label">Email</span><b>${esc(a.email||'—')}</b></div><div class="row"><span class="label">Service</span><b>${esc(a.service)}</b></div><div class="row"><span class="label">Amount</span><b>₹${esc(a.price||0)}</b></div><div class="row"><span class="label">Status</span><span class="status">${esc(a.status)}</span></div><div class="row"><span class="label">Remark</span><b>${esc(a.remarks||'—')}</b></div>`;document.getElementById('remarks').value=a.remarks||'';document.getElementById('payments').innerHTML=d.payments?.length?d.payments.map(p=>`<div class="doc">₹${esc(p.amount)} — ${esc(p.method)} — <b>${esc(p.status)}</b>${p.transaction_id?`<br><small>${esc(p.transaction_id)}</small>`:''}</div>`).join(''):'<p class="label">कोई payment record नहीं मिला।';document.getElementById('docs').innerHTML=d.documents?.length?d.documents.map(x=>`<div class="doc">📄 <b>${esc(x.document_type)}</b><br><small>${esc(x.status)}</small></div>`).join(''):'<p class="label">कोई document record नहीं मिला।'}catch(e){document.getElementById('title').textContent='Application load नहीं हुई';document.getElementById('details').innerHTML=`<p class="label">${esc(e.message)}</p>`}}
async function setStatus(status){try{await api(`/admin/applications/${encodeURIComponent((await api(`/admin/applications/${encodeURIComponent(no)}`)).application.id)}/status`,{method:'PATCH',body:JSON.stringify({status,remarks:document.getElementById('remarks').value.trim()})});alert('Application status update हो गया।');load()}catch(e){alert(e.message)}}
load();
</script></body></html>
