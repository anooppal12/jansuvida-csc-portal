<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Details | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8fd}.head{background:#0b1830;color:#fff;padding:16px 0}.head .container{display:flex;justify-content:space-between;align-items:center}.main{padding:30px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #e4eaf3;border-radius:18px;padding:22px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1f6;font-size:13px}.row:last-child{border:0}.label{color:#718096}.status{padding:5px 10px;border-radius:99px;background:#fff3d6;color:#946200;font-size:11px;font-weight:800}.doc{padding:13px;border:1px solid #e4eaf3;border-radius:11px;margin:9px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn-ok{background:#e7f8ef;color:#16704c}.btn-danger{background:#ffe9ec;color:#b42318}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="container"><strong>JANSUVIDA Admin</strong><button class="btn btn-light" onclick="location.href='index.html'">← Admin Dashboard</button></div></header><main class="main"><div class="container"><span class="eyebrow">Application Management</span><h1 id="title">Application Details</h1><div class="grid"><section class="panel"><h2>Applicant Details</h2><div id="details"></div><div class="actions" style="margin-top:20px"><button class="btn btn-ok" onclick="setStatus('approved')">✓ Approve</button><button class="btn btn-danger" onclick="setStatus('rejected')">✕ Reject</button><button class="btn btn-light" onclick="setStatus('processing')">Processing</button></div></section><section class="panel"><h2>Documents</h2><div id="docs"></div><p id="docNote" style="color:#718096;font-size:12px"></p></section></div></div></main><script>const params=new URLSearchParams(location.search),no=params.get('no');let apps=JSON.parse(localStorage.getItem('jansuvida_applications')||'[]');let app=apps.find(x=>x.application_no===no);if(!app){document.getElementById('title').textContent='Application नहीं मिली';document.getElementById('details').innerHTML='<p class="label">सही Application Number के साथ page खोलें।</p>'}else{document.getElementById('title').textContent=app.application_no;document.getElementById('details').innerHTML='<div class="row"><span class="label">Customer</span><b>'+app.name+'</b></div><div class="row"><span class="label">Mobile</span><b>'+app.mobile+'</b></div><div class="row"><span class="label">Service</span><b>'+app.service+'</b></div><div class="row"><span class="label">Date</span><b>'+app.date+'</b></div><div class="row"><span class="label">Status</span><span class="status">'+app.status+'</span></div><div class="row"><span class="label">Remark</span><b>'+((app.remark||'—'))+'</b></div>';const docs=JSON.parse(localStorage.getItem('jansuvida_documents')||'[]').filter(x=>x.appNo===no);document.getElementById('docs').innerHTML=docs.length?docs.map(x=>'<div class="doc"><span>📄 <b>'+x.type+'</b><br><small>'+x.name+'</small></span><span class="status">Uploaded</span></div>').join(''):'<p class="label">इस application के साथ अभी कोई document entry नहीं है।</p>'}function setStatus(status){if(!app)return;app.status=status;apps=apps.map(x=>x.application_no===app.application_no?app:x);localStorage.setItem('jansuvida_applications',JSON.stringify(apps));location.reload()}</script></body></html>
