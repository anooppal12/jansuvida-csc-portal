<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers | Jansuvida Admin</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8fd}.head{background:#0b1830;color:#fff;padding:16px 0}.head .container{display:flex;justify-content:space-between;align-items:center}.main{padding:30px 0}.panel{background:#fff;border:1px solid #e4eaf3;border-radius:18px;padding:22px}.filters{display:flex;gap:10px;margin:16px 0}.filters input{padding:11px;border:1px solid #d8e0eb;border-radius:9px;font:inherit;width:320px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #edf1f6;white-space:nowrap}.empty{text-align:center;color:#718096;padding:30px}@media(max-width:600px){.filters input{width:100%}}</style></head><body><header class="head"><div class="container"><strong>JANSUVIDA Admin</strong><button class="btn btn-light" onclick="location.href='index.html'">← Dashboard</button></div></header><main class="main"><div class="container"><span class="eyebrow">Customer Management</span><h1>Customers</h1><p style="color:#718096">Registered customer profiles और application activity.</p><section class="panel"><div class="filters"><input id="q" placeholder="नाम या मोबाइल से खोजें"></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Applications</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>function load(){const c=JSON.parse(localStorage.getItem('jansuvida_customer')||'null');const apps=JSON.parse(localStorage.getItem('jansuvida_applications')||'[]');const q=document.getElementById('q').value.toLowerCase();const rows=document.getElementById('rows');if(!c||!((c.name+c.mobile+c.email).toLowerCase().includes(q))){rows.innerHTML='<tr><td colspan="5" class="empty">कोई customer नहीं मिला।</td></tr>';return}const n=apps.filter(x=>x.mobile===c.mobile).length;rows.innerHTML='<tr><td><b>'+c.name+'</b></td><td>'+c.mobile+'</td><td>'+(c.email||'—')+'</td><td>'+n+'</td><td><button class="btn btn-light" onclick="location.href=\'application.html?no='+((apps.find(x=>x.mobile===c.mobile)||{}).application_no||'')+'\'">View Applications</button></td></tr>'}document.getElementById('q').oninput=load;load();</script></body></html>
