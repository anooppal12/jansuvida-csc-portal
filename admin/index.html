<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8fd}.admin{min-height:100vh}.top{background:#0b1830;color:#fff;padding:16px 0}.top .container{display:flex;align-items:center;justify-content:space-between}.admin-main{padding:32px 0}.side-layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.sidebar,.panel{background:#fff;border:1px solid #e4eaf3;border-radius:17px}.sidebar{padding:14px;height:max-content}.sidebar a{display:block;padding:11px 12px;border-radius:9px;text-decoration:none;color:#42526b;font-size:13px;font-weight:600}.sidebar a.active,.sidebar a:hover{background:#eef4ff;color:#1457d9}.content h1{margin:0}.muted{color:#718096}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:#fff;border:1px solid #e4eaf3;border-radius:15px;padding:18px}.stat b{font-size:26px;display:block}.panel{padding:20px}.filters{display:flex;gap:10px;margin:15px 0}.filters input,.filters select{padding:10px;border:1px solid #d8e0eb;border-radius:9px;font:inherit}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf1f6;white-space:nowrap}.status{padding:5px 9px;border-radius:99px;background:#fff3d6;color:#946200;font-size:11px;font-weight:800}.btn-small{border:0;border-radius:8px;padding:7px 10px;background:#eef4ff;color:#1457d9;font-weight:700;cursor:pointer}.empty{text-align:center;padding:30px;color:#718096}@media(max-width:850px){.side-layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:5px}.sidebar a{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:1fr}.filters{flex-direction:column}}</style></head><body class="admin"><header class="top"><div class="container"><strong>JANSUVIDA <span style="font-weight:400">Admin Panel</span></strong><button class="btn btn-light" onclick="location.href='../index.html'">Website</button></div></header><main class="admin-main"><div class="container side-layout"><aside class="sidebar"><a class="active" href="index.html">📊 Dashboard</a><a href="#applications">📋 Applications</a><a href="#customers">👥 Customers</a><a href="#services">🧾 Services</a><a href="#payments">💳 Payments</a></a><a href="#settings">⚙ Settings</a></aside><section class="content"><span class="eyebrow">Administration</span><h1>Dashboard</h1><p class="muted">CSC portal applications और customers का overview.</p><div class="stats"><div class="stat"><span class="muted">Applications</span><b id="total">0</b></div><div class="stat"><span class="muted">Pending</span><b id="pending">0</b></div><div class="stat"><span class="muted">Approved</span><b id="approved">0</b></div><div class="stat"><span class="muted">Customers</span><b id="customersCount">0</b></div></div><div class="panel" id="applications"><h2>Applications</h2><div class="filters"><input id="filter" placeholder="Application number / mobile"><select id="status"><option value="">All Status</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Application No.</th><th>Customer</th><th>Service</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div></main><script>function load(){const apps=JSON.parse(localStorage.getItem('jansuvida_applications')||'[]');document.getElementById('total').textContent=apps.length;document.getElementById('pending').textContent=apps.filter(x=>x.status==='pending').length;document.getElementById('approved').textContent=apps.filter(x=>x.status==='approved').length;document.getElementById('customersCount').textContent=localStorage.getItem('jansuvida_customer')?'1':'0';const q=document.getElementById('filter').value.toLowerCase();const st=document.getElementById('status').value;const rows=document.getElementById('rows');const list=apps.filter(x=>(!q||(x.application_no+x.mobile+x.name).toLowerCase().includes(q))&&(!st||x.status===st));rows.innerHTML=list.length?list.map(x=>'<tr><td>'+x.application_no+'</td><td>'+x.name+'<br><small>'+x.mobile+'</small></td><td>'+x.service+'</td><td>'+x.date+'</td><td><span class="status">'+x.status+'</span></td><td><button class="btn-small" onclick="approve(\''+x.application_no+'\')">Approve</button> <button class="btn-small" onclick="reject(\''+x.application_no+'\')">Reject</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">कोई application नहीं मिली।</td></tr>'}function change(no,status){const apps=JSON.parse(localStorage.getItem('jansuvida_applications')||'[]');const i=apps.findIndex(x=>x.application_no===no);if(i>=0){apps[i].status=status;localStorage.setItem('jansuvida_applications',JSON.stringify(apps));load()}}function approve(no){change(no,'approved')}function reject(no){change(no,'rejected')}document.getElementById('filter').oninput=load;document.getElementById('status').onchange=load;load();</script></body></html>
