<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8fd}.admin{min-height:100vh}.top{background:#0b1830;color:#fff;padding:16px 0}.top .container{display:flex;align-items:center;justify-content:space-between}.admin-main{padding:32px 0}.side-layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.sidebar,.panel,.login-panel{background:#fff;border:1px solid #e4eaf3;border-radius:17px}.sidebar{padding:14px;height:max-content}.sidebar a{display:block;padding:11px 12px;border-radius:9px;text-decoration:none;color:#42526b;font-size:13px;font-weight:600}.sidebar a.active,.sidebar a:hover{background:#eef4ff;color:#1457d9}.content h1{margin:0}.muted{color:#718096}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:#fff;border:1px solid #e4eaf3;border-radius:15px;padding:18px}.stat b{font-size:26px;display:block}.panel{padding:20px}.filters{display:flex;gap:10px;margin:15px 0}.filters input,.filters select,.login-panel input{padding:10px;border:1px solid #d8e0eb;border-radius:9px;font:inherit}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf1f6;white-space:nowrap}.status{padding:5px 9px;border-radius:99px;background:#fff3d6;color:#946200;font-size:11px;font-weight:800}.btn-small{border:0;border-radius:8px;padding:7px 10px;background:#eef4ff;color:#1457d9;font-weight:700;cursor:pointer}.empty{text-align:center;padding:30px;color:#718096}.login-panel{max-width:430px;margin:70px auto;padding:28px}.login-panel label{display:block;margin:14px 0;font-weight:600}.login-panel input{display:block;width:100%;box-sizing:border-box;margin-top:6px}.error{color:#b42318;margin-top:10px}@media(max-width:850px){.side-layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:5px}.sidebar a{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:1fr}.filters{flex-direction:column}}</style></head><body class="admin"><header class="top"><div class="container"><strong>JANSUVIDA <span style="font-weight:400">Admin Panel</span></strong><div><button class="btn btn-light" id="logout" hidden>Logout</button> <button class="btn btn-light" onclick="location.href='../index.html'">Website</button></div></div></header><main class="admin-main"><div class="container" id="app"></div></main><script>
const API='/api';const tokenKey='jansuvida_admin_token';function token(){return localStorage.getItem(tokenKey)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){const h={...(opt.headers||{})};if(token())h.Authorization='Bearer '+token();if(opt.body)h['Content-Type']='application/json';const r=await fetch(API+path,{...opt,headers:h});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b}
function loginView(){document.getElementById('app').innerHTML='<section class="login-panel"><span class="eyebrow">Secure Administration</span><h1>Admin Login</h1><p class="muted">Admin credentials से dashboard में प्रवेश करें।</p><form id="loginForm"><label>Username<input id="user" required autocomplete="username"></label><label>Password<input id="pass" type="password" required autocomplete="current-password"></label><button class="btn btn-primary btn-lg" type="submit">Login →</button><div id="err" class="error"></div></form></section>';document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/admin/auth/login',{method:'POST',body:JSON.stringify({username:user.value,password:pass.value})});localStorage.setItem(tokenKey,d.accessToken);render()}catch(x){document.getElementById('err').textContent=x.message}}}
async function render(){if(!token()){document.getElementById('logout').hidden=true;loginView();return}document.getElementById('logout').hidden=false;document.getElementById('app').innerHTML='<div class="side-layout"><aside class="sidebar"><a class="active" href="#applications">📊 Applications</a><a href="customers.html">👥 Customers</a><a href="services.html">🧾 Services</a><a href="payments.html">💳 Payments</a></aside><section class="content"><span class="eyebrow">Administration</span><h1>Dashboard</h1><p class="muted">Live database से applications का overview.</p><div class="stats"><div class="stat"><span class="muted">Applications</span><b id="total">0</b></div><div class="stat"><span class="muted">Pending</span><b id="pending">0</b></div><div class="stat"><span class="muted">Approved</span><b id="approved">0</b></div><div class="stat"><span class="muted">Processing</span><b id="processing">0</b></div></div><div class="panel" id="applications"><h2>Applications</h2><div class="filters"><input id="filter" placeholder="Application number / mobile / customer"><select id="status"><option value="">All Status</option><option value="pending">Pending</option><option value="processing">Processing</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="completed">Completed</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Customer</th><th>Service</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div>';document.getElementById('filter').oninput=load;document.getElementById('status').onchange=load;await load()}
async function load(){try{const q=document.getElementById('filter').value.toLowerCase();const st=document.getElementById('status').value;const d=await api('/admin/applications'+(st?'?status='+encodeURIComponent(st):''));let list=d.applications||[];document.getElementById('total').textContent=list.length;document.getElementById('pending').textContent=list.filter(x=>x.status==='pending').length;document.getElementById('approved').textContent=list.filter(x=>x.status==='approved').length;document.getElementById('processing').textContent=list.filter(x=>x.status==='processing').length;list=list.filter(x=>!q||(x.application_no+' '+x.mobile+' '+x.customer_name).toLowerCase().includes(q));document.getElementById('rows').innerHTML=list.length?list.map(x=>'<tr><td><b>'+esc(x.application_no)+'</b><br><small>'+esc(x.created_at)+'</small></td><td>'+esc(x.customer_name)+'<br><small>'+esc(x.mobile)+'</small></td><td>'+esc(x.service)+'</td><td>'+esc(x.payment_status)+'</td><td><span class="status">'+esc(x.status)+'</span></td><td><button class="btn-small" onclick="openApp('+JSON.stringify(x.application_no)+')">View</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">कोई application नहीं मिली।</td></tr>'}catch(e){if(e.message.includes('authentication')){localStorage.removeItem(tokenKey);loginView()}else alert(e.message)}}function openApp(no){location.href='application.html?no='+encodeURIComponent(no)}document.getElementById('logout').onclick=()=>{localStorage.removeItem(tokenKey);render()};render();
</script></body></html>
