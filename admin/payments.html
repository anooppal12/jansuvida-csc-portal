<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | Jansuvida Admin</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8fd}.head{background:#0b1830;color:#fff;padding:16px 0}.head .container{display:flex;justify-content:space-between;align-items:center}.main{padding:30px 0}.panel{background:#fff;border:1px solid #e4eaf3;border-radius:18px;padding:22px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #edf1f6;white-space:nowrap}.status{padding:5px 9px;border-radius:99px;background:#fff3d6;color:#946200;font-size:11px;font-weight:800}.success{background:#e7f8ef;color:#16704c}.danger{background:#ffe9ec;color:#b42318}.btn-small{border:0;border-radius:8px;padding:7px 10px;background:#eef4ff;color:#1457d9;font-weight:700;cursor:pointer}.empty{text-align:center;padding:30px;color:#718096}@media(max-width:650px){.actions{display:flex;flex-direction:column}}</style></head><body><header class="head"><div class="container"><strong>JANSUVIDA Admin</strong><button class="btn btn-light" onclick="location.href='index.html'">← Dashboard</button></div></header><main class="main"><div class="container"><span class="eyebrow">Payment Management</span><h1>Payments</h1><p style="color:#718096">Customer payment requests को verify करें।</p><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Amount</th><th>Method</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>function load(){const p=JSON.parse(localStorage.getItem('jansuvida_payments')||'[]');const rows=document.getElementById('rows');rows.innerHTML=p.length?p.slice().reverse().map((x,i)=>'<tr><td>'+x.application_no+'</td><td>₹'+Number(x.amount).toFixed(2)+'</td><td>'+x.method+'</td><td>'+x.date+'</td><td><span class="status '+(x.status==='success'?'success':x.status==='failed'?'danger':'')+'">'+x.status+'</span></td><td><button class="btn-small" onclick="change('+i+',\'success\')">Verify</button> <button class="btn-small" onclick="change('+i+',\'failed\')">Reject</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">अभी कोई payment request नहीं है।</td></tr>'}function change(reverseIndex,status){const p=JSON.parse(localStorage.getItem('jansuvida_payments')||'[]');const i=p.length-1-reverseIndex;if(i>=0){p[i].status=status;localStorage.setItem('jansuvida_payments',JSON.stringify(p));load()}}load();</script></body></html>
