<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services | Jansuvida Admin</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8fd}.head{background:#0b1830;color:#fff;padding:16px 0}.head .container{display:flex;justify-content:space-between;align-items:center}.main{padding:30px 0}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:#fff;border:1px solid #e4eaf3;border-radius:18px;padding:22px}.field{display:block;font-size:13px;font-weight:700;margin:14px 0}.field input,.field select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #d8e0eb;border-radius:9px;font:inherit}.service{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #edf1f6}.service:last-child{border:0}.muted{color:#718096;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="container"><strong>JANSUVIDA Admin</strong><button class="btn btn-light" onclick="location.href='index.html'">← Dashboard</button></div></header><main class="main"><div class="container"><span class="eyebrow">Service Management</span><h1>Services</h1><div class="grid"><section class="panel"><h2>Add Service</h2><form id="form"><label class="field">Service Name<input id="name" required placeholder="जैसे PAN Card"></label><label class="field">Category<input id="category" required placeholder="Identity Services"></label><label class="field">Price (₹)<input id="price" type="number" min="0" step="0.01" value="0"></label><button class="btn btn-primary" style="width:100%">Add Service</button></form></section><section class="panel"><h2>Available Services</h2><div id="list"></div></section></div></div></main><script>const key='jansuvida_admin_services';const defaults=[['Aadhaar Services','Identity Services',0],['PAN Card','Identity Services',0],['PM Kisan','Government Schemes',0],['Ayushman Bharat','Government Schemes',0],['AEPS / Banking','Banking',0],['Insurance','Insurance',0],['Farmer Registry','Agriculture',0],['CM Yuva Loan','Loans',0]];function get(){const x=JSON.parse(localStorage.getItem(key)||'null');if(x)return x;localStorage.setItem(key,JSON.stringify(defaults.map(v=>({name:v[0],category:v[1],price:v[2]}))));return JSON.parse(localStorage.getItem(key))}function render(){document.getElementById('list').innerHTML=get().map((x,i)=>'<div class="service"><span><b>'+x.name+'</b><br><span class="muted">'+x.category+' • ₹'+Number(x.price).toFixed(2)+'</span></span><button class="btn btn-light" onclick="removeService('+i+')">Remove</button></div>').join('')}function removeService(i){const x=get();x.splice(i,1);localStorage.setItem(key,JSON.stringify(x));render()}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const x=get();x.push({name:document.getElementById('name').value,category:document.getElementById('category').value,price:Number(document.getElementById('price').value||0)});localStorage.setItem(key,JSON.stringify(x));e.target.reset();document.getElementById('price').value=0;render()});render();</script></body></html>
