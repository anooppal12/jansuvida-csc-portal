<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jansuvida - Customer Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:#0b4f9c;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.wrap{max-width:1150px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 18px #0001}.card h3{margin:0 0 8px}.muted{color:#697386;font-size:14px}.apps{margin-top:20px}.app{border:1px solid #e4e9f0;border-radius:10px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:5px 10px;border-radius:20px;background:#eef4ff;color:#0b4f9c;font-size:12px}.btn{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:#0b4f9c;color:white}.btn.red{background:#b42318}.btn.green{background:#087443}.empty{padding:35px;text-align:center;color:#697386}a{color:#fff;text-decoration:none}.panel{margin-top:15px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:15px}.panel h3{margin-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.input{padding:9px;border:1px solid #ccd4df;border-radius:7px}.small{font-size:13px}</style>
</head>
<body>
<header class="top"><h1>Jansuvida Customer Dashboard</h1><button class="btn red" onclick="logout()">Logout</button></header>
<main class="wrap">
<div class="grid"><div class="card"><h3 id="total">0</h3><div class="muted">My Applications</div></div><div class="card"><h3 id="pending">0</h3><div class="muted">Pending</div></div><div class="card"><h3 id="approved">0</h3><div class="muted">Approved</div></div><div class="card"><h3 id="notice">0</h3><div class="muted">Unread Notifications</div></div></div>
<section class="card apps"><div class="row"><h2>My Applications</h2><a class="btn" href="index.html">New Service</a></div><div id="list"><div class="empty">Applications loading...</div></div></section>
</main>
<script src="assets/js/api.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=null;
async function load(){
 if(!JansuvidaAPI.getToken()){location.href='index.html';return}
 try{
  const [a,n]=await Promise.all([JansuvidaAPI.applications(),JansuvidaAPI.notifications()]);
  const apps=a.applications||[], ns=n.notifications||[];
  total.textContent=apps.length; pending.textContent=apps.filter(x=>String(x.status).toLowerCase()==='pending').length; approved.textContent=apps.filter(x=>['approved','completed'].includes(String(x.status).toLowerCase())).length; notice.textContent=ns.filter(x=>!x.is_read&&!x.read_at).length;
  list.innerHTML=apps.length?apps.map(x=>`<div class="app"><div class="row"><strong>${esc(x.application_no||'Application')}</strong><span class="badge">${esc(x.status||'Pending')}</span></div><p>${esc(x.service_name||x.service_id||'Service')}</p><div class="muted">Submitted: ${x.created_at?new Date(x.created_at).toLocaleString('en-IN'):'-'}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="openApp(${Number(x.id)})">View / Manage</button></div></div>`).join(''):'<div class="empty">अभी कोई application नहीं है।</div>';
 }catch(e){list.innerHTML='<div class="empty">Dashboard load नहीं हो सका: '+esc(e.message)+'</div>'}
}
async function openApp(id){
 try{selected=await JansuvidaAPI.application(id); const a=selected.application||selected; const [d,p]=await Promise.all([JansuvidaAPI.documents(id),JansuvidaAPI.payments()]);
  const docs=(d.documents||[]), pays=(p.payments||[]).filter(x=>Number(x.application_id||x.applicationId)===Number(id));
  const old=document.getElementById('detail'); if(old)old.remove();
  const sec=document.createElement('div');sec.id='detail';sec.className='panel';sec.innerHTML=`<h3>${esc(a.application_no||'Application')}</h3><p><b>Service:</b> ${esc(a.service_name||a.service_id||'-')} &nbsp; <b>Status:</b> ${esc(a.status||'-')}</p><div><b>Payments</b>${pays.length?pays.map(x=>`<p class="small">₹${esc(x.amount)} — ${esc(x.method)} — <span class="badge">${esc(x.status)}</span></p>`).join(''):'<p class="muted">Payment request नहीं है।</p>'}<button class="btn green" onclick="pay(${Number(id)})">UPI Payment Request</button> <button class="btn" onclick="cash(${Number(id)})">Cash Payment Request</button></div><hr><div><b>Documents</b>${docs.length?docs.map(x=>`<p class="small">${esc(x.original_name)} — <span class="badge">${esc(x.status)}</span></p>`).join(''):'<p class="muted">अभी document नहीं है।</p>'}<div class="actions"><select id="dtype" class="input"><option value="aadhaar">Aadhaar</option><option value="pan">PAN</option><option value="bank_passbook">Bank Passbook</option><option value="photo">Photo</option><option value="address_proof">Address Proof</option><option value="other">Other</option></select><input id="dname" class="input" placeholder="Document file name"><button class="btn" onclick="addDoc(${Number(id)})">Save Document</button></div><p class="muted small">नोट: अभी backend storage key मांगता है; यह form document metadata save करता है।</p></div>`;document.querySelector('.apps').appendChild(sec);sec.scrollIntoView({behavior:'smooth'});
 }catch(e){alert(e.message)}
}
async function pay(id){try{await JansuvidaAPI.createPayment({applicationId:id,method:'upi'});alert('UPI payment request submit हो गई।');openApp(id)}catch(e){alert(e.message)}}
async function cash(id){try{await JansuvidaAPI.createPayment({applicationId:id,method:'cash'});alert('Cash payment request submit हो गई।');openApp(id)}catch(e){alert(e.message)}}
async function addDoc(id){const name=document.getElementById('dname').value.trim();const type=document.getElementById('dtype').value;if(!name)return alert('Document name डालें');try{await JansuvidaAPI.addDocument({applicationId:id,type,originalName:name,storageKey:'customer/'+Date.now()+'-'+name.replace(/[^a-zA-Z0-9._-]/g,'_')});alert('Document record save हो गया।');openApp(id)}catch(e){alert(e.message)}}
function logout(){JansuvidaAPI.logout();location.href='index.html'}load();
</script>
</body></html>
