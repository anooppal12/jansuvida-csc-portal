<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jansuvida - Customer Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:#0b4f9c;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.wrap{max-width:1150px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 18px #0001}.card h3{margin:0 0 8px}.muted{color:#697386;font-size:14px}.apps{margin-top:20px}.app{border:1px solid #e4e9f0;border-radius:10px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:5px 10px;border-radius:20px;background:#eef4ff;color:#0b4f9c;font-size:12px}.btn{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:#0b4f9c;color:white}.btn.red{background:#b42318}.empty{padding:35px;text-align:center;color:#697386}a{color:#fff;text-decoration:none}</style>
</head>
<body>
<header class="top"><h1>Jansuvida Customer Dashboard</h1><button class="btn red" onclick="logout()">Logout</button></header>
<main class="wrap">
<div class="grid"><div class="card"><h3 id="total">0</h3><div class="muted">My Applications</div></div><div class="card"><h3 id="pending">0</h3><div class="muted">Pending</div></div><div class="card"><h3 id="approved">0</h3><div class="muted">Approved</div></div><div class="card"><h3 id="notice">0</h3><div class="muted">Unread Notifications</div></div></div>
<section class="card apps"><div class="row"><h2>My Applications</h2><a class="btn" href="index.html">New Service</a></div><div id="list"><div class="empty">Applications loading...</div></div></section>
</main>
<script src="assets/js/api.js"></script>
<script>
async function load(){
 if(!JansuvidaAPI.getToken()){location.href='index.html';return}
 try{
  const [a,n]=await Promise.all([JansuvidaAPI.applications(),JansuvidaAPI.notifications()]);
  const apps=a.applications||[]; const ns=n.notifications||[];
  total.textContent=apps.length; pending.textContent=apps.filter(x=>String(x.status).toLowerCase()==='pending').length; approved.textContent=apps.filter(x=>['approved','completed'].includes(String(x.status).toLowerCase())).length; notice.textContent=ns.filter(x=>!x.is_read&&!x.read_at).length;
  list.innerHTML=apps.length?apps.map(x=>`<div class="app"><div class="row"><strong>${x.application_no||'Application'}</strong><span class="badge">${x.status||'Pending'}</span></div><p>${x.service_name||x.service_id||'Service'}</p><div class="muted">Submitted: ${x.created_at?new Date(x.created_at).toLocaleString('en-IN'):'-'}</div></div>`).join(''):'<div class="empty">अभी कोई application नहीं है।</div>';
 }catch(e){list.innerHTML='<div class="empty">Dashboard load नहीं हो सका: '+e.message+'</div>'}
}
function logout(){JansuvidaAPI.logout();location.href='index.html'}
load();
</script>
</body></html>
