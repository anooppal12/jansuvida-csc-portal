<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.top,.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:20px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{padding:18px;border:1px solid #e5eaf2;border-radius:14px}.num{font-size:28px;font-weight:800;margin-top:6px}.btn{border:0;border-radius:9px;padding:9px 12px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.out{background:#eef3fa;color:#172033}.muted{color:#697586;font-size:13px}.notice{padding:12px;border-radius:10px;background:#fff5d8}.danger{background:#fff0f0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f5;vertical-align:top}.scroll{overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.select{padding:8px;border:1px solid #d6deea;border-radius:8px}</style></head><body><div class="wrap"><div class="top"><div><b>JANSUVIDA ADMIN</b><div class="muted" id="welcome">CSC Customer Portal Management</div></div><div><button class="btn out" id="logout">Logout</button> <button class="btn out" onclick="location.href='../index.html'">Website</button></div></div><div class="grid"><div class="stat"><div class="muted">Customers</div><div class="num" id="customers">—</div></div><div class="stat"><div class="muted">Applications</div><div class="num" id="applications">—</div></div><div class="stat"><div class="muted">Pending Payments</div><div class="num" id="payments">—</div></div><div class="stat"><div class="muted">Pending Documents</div><div class="num" id="documents">—</div></div></div><div class="card"><div id="msg" class="notice">Data load हो रहा है...</div></div><div class="card"><h2>Customers</h2><div class="scroll"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Email</th><th>Status</th><th>Joined</th></tr></thead><tbody id="customerRows"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></div><div class="card"><h2>Applications</h2><div class="scroll"><table class="table"><thead><tr><th>Application</th><th>Customer</th><th>Service</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody id="applicationRows"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></div></div><script src="../assets/js/api.js"></script><script>const token=localStorage.getItem('jansuvida_admin_token');const admin=JSON.parse(localStorage.getItem('jansuvida_admin')||'null');if(!token)location.href='admin-login.html';if(admin)document.getElementById('welcome').textContent='Logged in as '+admin.username;document.getElementById('logout').onclick=()=>{localStorage.removeItem('jansuvida_admin_token');localStorage.removeItem('jansuvida_admin');location.href='admin-login.html'};async function api(path,options={}){const r=await fetch(JansuvidaAPI.base+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){try{const [s,c,a]=await Promise.all([api('/admin/manage/summary'),api('/admin/manage/customers'),api('/admin/manage/applications')]);document.getElementById('customers').textContent=s.customers;document.getElementById('applications').textContent=s.applications;document.getElementById('payments').textContent=s.pendingPayments;document.getElementById('documents').textContent=s.pendingDocuments;document.getElementById('customerRows').innerHTML=c.customers.map(x=>'<tr><td>'+x.id+'</td><td><b>'+x.name+'</b></td><td>'+x.mobile+'</td><td>'+ (x.email||'—')+'</td><td>'+x.status+'</td><td>'+x.created_at+'</td></tr>').join('')||'<tr><td colspan="6">No customers</td></tr>';document.getElementById('applicationRows').innerHTML=a.applications.map(x=>'<tr><td><b>'+x.application_no+'</b><br><span class="muted">'+x.created_at+'</span></td><td>'+x.customer_name+'<br>'+x.mobile+'</td><td>'+x.service+'</td><td>₹'+Number(x.price).toFixed(2)+'</td><td>'+x.status+'</td><td><div class="actions"><select class="select" id="st'+x.id+'"><option>pending</option><option>processing</option><option>approved</option><option>completed</option><option>rejected</option></select><button class="btn" onclick="updateStatus('+x.id+')">Update</button></div></td></tr>').join('')||'<tr><td colspan="6">No applications</td></tr>';document.querySelectorAll('select').forEach((el,i)=>{const row=a.applications[i];if(row)el.value=row.status});document.getElementById('msg').textContent='Live customer और application data loaded.'}catch(e){document.getElementById('msg').textContent=e.message;document.getElementById('msg').className='notice danger'}}async function updateStatus(id){try{const status=document.getElementById('st'+id).value;await api('/admin/manage/applications/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await load();}catch(e){alert(e.message)}}load();</script></body></html>
