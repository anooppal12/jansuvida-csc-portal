<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0;color:#172033}.wrap{max-width:1150px;margin:auto;padding:24px}.top,.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:20px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{padding:18px;border:1px solid #e5eaf2;border-radius:14px}.num{font-size:28px;font-weight:800;margin-top:6px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.out{background:#eef3fa;color:#172033}.muted{color:#697586;font-size:13px}.notice{padding:12px;border-radius:10px;background:#fff5d8}.danger{background:#fff0f0}</style></head><body><div class="wrap"><div class="top"><div><b>JANSUVIDA ADMIN</b><div class="muted" id="welcome">CSC Customer Portal Management</div></div><div><button class="btn out" id="logout">Logout</button> <button class="btn out" onclick="location.href='../index.html'">Website</button></div></div><div class="grid"><div class="stat"><div class="muted">Customers</div><div class="num" id="customers">—</div></div><div class="stat"><div class="muted">Applications</div><div class="num" id="applications">—</div></div><div class="stat"><div class="muted">Pending Payments</div><div class="num" id="payments">—</div></div><div class="stat"><div class="muted">Pending Documents</div><div class="num" id="documents">—</div></div></div><div class="card"><h2>Live Dashboard</h2><div id="msg" class="notice">Data load हो रहा है...</div></div><div class="card"><h2>Management</h2><div class="grid"><button class="btn" onclick="alert('Customers module अगला चरण है')">Customers</button><button class="btn" onclick="alert('Applications module अगला चरण है')">Applications</button><button class="btn" onclick="alert('Documents module अगला चरण है')">Documents</button><button class="btn" onclick="alert('Payments module अगला चरण है')">Payments</button><button class="btn" onclick="alert('Services module अगला चरण है')">Services</button></div></div></div><script src="../assets/js/api.js"></script><script>const token=localStorage.getItem('jansuvida_admin_token');const admin=JSON.parse(localStorage.getItem('jansuvida_admin')||'null');if(!token)location.href='admin-login.html';if(admin)document.getElementById('welcome').textContent='Logged in as '+admin.username;document.getElementById('logout').onclick=()=>{localStorage.removeItem('jansuvida_admin_token');localStorage.removeItem('jansuvida_admin');location.href='admin-login.html'};async function load(){try{const r=await fetch(JansuvidaAPI.base+'/admin/dashboard/stats',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load dashboard');document.getElementById('customers').textContent=d.stats.customers;document.getElementById('applications').textContent=d.stats.applications;document.getElementById('payments').textContent=d.stats.pendingPayments;document.getElementById('documents').textContent=d.stats.pendingDocuments;document.getElementById('msg').textContent='Database से live statistics successfully loaded.'}catch(e){document.getElementById('msg').textContent=e.message;document.getElementById('msg').className='notice danger'}}load();</script></body></html>
