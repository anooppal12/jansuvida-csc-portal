<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0}.wrap{max-width:420px;margin:70px auto;padding:20px}.box{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 16px;border:1px solid #d6deea;border-radius:9px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#172033;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:15px;font-size:13px;color:#b42318}</style></head><body><div class="wrap"><div class="box"><h1>JANSUVIDA</h1><p>Admin Panel Login</p><form id="form"><label>Username</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn">Admin Login</button></form><div id="msg" class="msg"></div></div></div><script src="../assets/js/api.js"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Login हो रहा है...';try{const r=await fetch(JansuvidaAPI.base+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');localStorage.setItem('jansuvida_admin_token',d.accessToken);localStorage.setItem('jansuvida_admin',JSON.stringify(d.admin));location.href='admin-dashboard.html'}catch(err){msg.textContent=err.message}};</script></body></html>
