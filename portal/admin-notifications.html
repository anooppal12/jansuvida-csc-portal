<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send Notification | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0;color:#172033}.wrap{max-width:700px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:22px}label{display:block;font-weight:700;margin:14px 0 7px}select,input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d6deea;border-radius:9px;font:inherit}textarea{min-height:130px;resize:vertical}.btn{border:0;border-radius:9px;padding:11px 15px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.out{background:#eef3fa;color:#172033}.msg{margin-top:14px;padding:12px;border-radius:9px;background:#fff5d8}</style></head><body><div class="wrap"><div class="card"><h1>🔔 Send Customer Notification</h1><label>Customer</label><select id="customer"><option>Loading...</option></select><label>Type</label><select id="type"><option value="info">Information</option><option value="application">Application</option><option value="document">Document</option><option value="payment">Payment</option><option value="success">Success</option><option value="warning">Warning</option></select><label>Title</label><input id="title" maxlength="150" placeholder="Notification title"><label>Message</label><textarea id="message" maxlength="2000" placeholder="Customer को क्या बताना है..."></textarea><br><br><button class="btn" id="send">Send Notification</button> <button class="btn out" onclick="location.href='admin-dashboard.html'">Back</button><div id="msg"></div></div></div><script>const token=localStorage.getItem('jansuvida_admin_token');if(!token)location.href='admin-login.html';const base=(window.JANSUVIDA_API_BASE||localStorage.getItem('jansuvida_api_base')||'http://localhost:3000/api');const customer=document.getElementById('customer'),msg=document.getElementById('msg');async function api(path,options={}){const r=await fetch(base+path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){try{const d=await api('/admin/notifications/customers');customer.innerHTML=d.customers.map(c=>'<option value="'+c.id+'">'+String(c.name).replace(/[&<>"']/g,'')+' — '+String(c.mobile).replace(/[&<>"']/g,'')+'</option>').join('')||'<option value="">No customers</option>'}catch(e){customer.innerHTML='<option>'+e.message+'</option>'}}document.getElementById('send').onclick=async()=>{try{const r=await api('/admin/notifications/send',{method:'POST',body:JSON.stringify({customerId:Number(customer.value),type:document.getElementById('type').value,title:document.getElementById('title').value,message:document.getElementById('message').value})});msg.innerHTML='<div class="msg">Notification successfully send हो गई।</div>';document.getElementById('title').value='';document.getElementById('message').value=''}catch(e){msg.innerHTML='<div class="msg">'+e.message+'</div>'}};load();</script></body></html>
