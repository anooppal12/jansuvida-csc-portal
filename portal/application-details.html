<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Details | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0;color:#172033}.wrap{max-width:850px;margin:auto;padding:24px}.top,.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:20px;margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafd;border-radius:12px;padding:14px}.label{font-size:12px;color:#697586}.value{font-weight:700;margin-top:4px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.out{background:#eef3fa;color:#172033}.row{padding:12px 0;border-bottom:1px solid #edf0f5}.muted{color:#697586;font-size:13px}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef3fa}</style></head><body><div class="wrap"><div class="top"><div><b>JANSUVIDA</b><div class="muted">Application Details</div></div><button class="btn out" onclick="location.href='customer-dashboard.html'">Dashboard</button></div><div id="content" class="card">Loading...</div></div><script src="../assets/js/api.js"></script><script>const token=localStorage.getItem('jansuvida_access_token');if(!token)location.href='login.html';const no=new URLSearchParams(location.search).get('applicationNo');if(!no)location.href='customer-dashboard.html';async function api(path){const r=await fetch(JansuvidaAPI.base+path,{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{const a=await api('/applications/'+encodeURIComponent(no));const d=await api('/documents/application/'+a.application.id);const p=await api('/payments');const payments=p.payments.filter(x=>String(x.application_no)===String(a.application.application_no));document.getElementById('content').innerHTML='<h1>'+esc(a.application.application_no)+'</h1><div class="grid"><div class="item"><div class="label">Service</div><div class="value">'+esc(a.application.service)+'</div></div><div class="item"><div class="label">Amount</div><div class="value">₹'+Number(a.application.price).toFixed(2)+'</div></div><div class="item"><div class="label">Status</div><div class="value"><span class="status">'+esc(a.application.status)+'</span></div></div><div class="item"><div class="label">Created</div><div class="value">'+esc(a.application.created_at)+'</div></div></div><h2>Remarks</h2><p>'+esc(a.application.remarks||'No remarks')+'</p><h2>Documents</h2>'+(d.documents.length?d.documents.map(x=>'<div class="row"><b>'+esc(x.document_type)+'</b> — '+esc(x.original_name)+'<br><span class="muted">Status: '+esc(x.status)+(x.remarks?' • '+esc(x.remarks):'')+'</span></div>').join(''):'<p class="muted">No documents uploaded.</p>')+'<h2>Payments</h2>'+(payments.length?payments.map(x=>'<div class="row"><b>₹'+Number(x.amount).toFixed(2)+'</b> — '+esc(x.method)+' — <strong>'+esc(x.status)+'</strong><br><span class="muted">'+esc(x.created_at)+'</span></div>').join(''):'<p class="muted">No payment record.</p>')+'<div style="margin-top:18px"><button class="btn" onclick="location.href=\'upload-document.html?applicationId='+a.application.id+'\'">📎 Upload Documents</button></div>'}catch(e){document.getElementById('content').innerHTML='<p>'+esc(e.message)+'</p>'}}load();</script></body></html>
