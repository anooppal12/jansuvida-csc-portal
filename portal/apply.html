<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply Service | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="section"><div class="container" style="max-width:760px"><div class="portal-card"><a class="brand" href="../index.html"><span class="brand-mark">J</span><span><strong>JANSUVIDA</strong><small>Service Application</small></span></a><div style="margin-top:28px"><span class="eyebrow">Online Application</span><h1 style="margin:0">नई सेवा के लिए आवेदन</h1><p style="color:#667085">सेवा चुनें और अपनी basic details भरें।</p></div><form id="applyForm"><label style="display:block;font-weight:700;font-size:13px;margin:16px 0">Service<select id="service" required style="display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"><option value="">सेवा चुनें</option><option>Aadhaar Services</option><option>PAN Card</option><option>PM Kisan</option><option>Ayushman Bharat</option><option>AEPS / Banking</option><option>Insurance</option><option>Farmer Registry</option><option>CM Yuva Loan</option></select></label><label style="display:block;font-weight:700;font-size:13px;margin:16px 0">Applicant Name<input id="name" required style="display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><label style="display:block;font-weight:700;font-size:13px;margin:16px 0">Mobile Number<input id="mobile" type="tel" maxlength="10" pattern="[0-9]{10}" required style="display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><label style="display:block;font-weight:700;font-size:13px;margin:16px 0">Remark / Requirement<textarea id="remark" rows="4" style="display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></textarea></label><button class="btn btn-primary btn-lg" style="width:100%">Submit Application →</button></form><div id="success" hidden style="margin-top:20px;padding:16px;background:#eef7f2;border:1px solid #cce9da;border-radius:12px;color:#16704c"></div></div></div></main><script>const c=JSON.parse(localStorage.getItem('jansuvida_customer')||'null');if(!c)location.href='login.html';else{document.getElementById('name').value=c.name||'';document.getElementById('mobile').value=c.mobile||''}document.getElementById('applyForm').addEventListener('submit',e=>{e.preventDefault();const no='JS-'+new Date().getFullYear()+'-'+Math.floor(100000+Math.random()*900000);const item={application_no:no,service:document.getElementById('service').value,name:document.getElementById('name').value,mobile:document.getElementById('mobile').value,remark:document.getElementById('remark').value,status:'pending',date:new Date().toLocaleDateString('en-IN')};const apps=JSON.parse(localStorage.getItem('jansuvida_applications')||'[]');apps.push(item);localStorage.setItem('jansuvida_applications',JSON.stringify(apps));const s=document.getElementById('success');s.hidden=false;s.innerHTML='<strong>आवेदन सफलतापूर्वक दर्ज हुआ।</strong><br>Application No.: <strong>'+no+'</strong><br><small>इस नंबर को सुरक्षित रखें।</small>';e.target.reset();});</script></body></html>
