<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Dashboard | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0;color:#172033}.wrap{max-width:1000px;margin:auto;padding:24px}.top,.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:20px;margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.service{border:1px solid #e5eaf2;border-radius:14px;padding:16px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.out{background:#eef3fa;color:#172033}.muted{color:#697586;font-size:13px}.msg{padding:12px;border-radius:10px;background:#fff5d8;margin-top:12px}</style></head><body><div class="wrap"><div class="top"><div><b>JANSUVIDA</b><div id="welcome" class="muted">Customer Portal</div></div><button class="btn out" id="logout">Logout</button></div><div class="card"><h2>Available Services</h2><div id="services" class="grid">Loading...</div><div id="msg"></div></div><div class="card"><h2>My Applications</h2><div id="apps" class="muted">Loading...</div></div></div><script src="../assets/js/api.js"></script><script>const customer=JSON.parse(localStorage.getItem('jansuvida_customer')||'null');if(!localStorage.getItem('jansuvida_access_token'))location.href='login.html';document.getElementById('welcome').textContent=customer?'Welcome, '+customer.name:'Customer Portal';document.getElementById('logout').onclick=()=>{JansuvidaAPI.logout();location.href='login.html'};async function load(){try{const s=await JansuvidaAPI.services();document.getElementById('services').innerHTML=s.services.map(x=>'<div class="service"><b>'+x.name+'</b><p class="muted">'+(x.description||'CSC service')+'</p><strong>₹'+Number(x.price).toFixed(2)+'</strong><br><button class="btn" style="margin-top:10px" onclick="apply('+x.id+')">Apply</button></div>').join('')||'<span class="muted">कोई service उपलब्ध नहीं।</span>';const a=await JansuvidaAPI.applications();document.getElementById('apps').innerHTML=a.applications.length?a.applications.map(x=>'<div style="padding:12px 0;border-bottom:1px solid #edf0f5"><b>'+x.application_no+'</b> — '+x.service+' — <strong>'+x.status+'</strong><br><span class="muted">₹'+Number(x.price).toFixed(2)+' • '+x.created_at+'</span></div>').join(''):'अभी कोई application नहीं है।'}catch(e){document.getElementById('msg').innerHTML='<div class="msg">'+e.message+'</div>'}}async function apply(id){try{const r=await JansuvidaAPI.createApplication({serviceId:id,details:{source:'customer-dashboard'}});document.getElementById('msg').innerHTML='<div class="msg">Application बन गया: <b>'+r.application.applicationNo+'</b></div>';load()}catch(e){document.getElementById('msg').innerHTML='<div class="msg">'+e.message+'</div>'}}load();</script></body></html>
