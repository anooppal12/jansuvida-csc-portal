<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Dashboard | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0;color:#172033}.wrap{max-width:1050px;margin:auto;padding:24px}.top,.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:20px;margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.profile .item{padding:12px;background:#f8fafd;border-radius:10px}.service{border:1px solid #e5eaf2;border-radius:14px;padding:16px}.row{padding:13px 0;border-bottom:1px solid #edf0f5}.btn{border:0;border-radius:9px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.out{background:#eef3fa;color:#172033}.muted{color:#697586;font-size:13px}.msg{padding:12px;border-radius:10px;background:#fff5d8;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}</style></head><body><div class="wrap"><div class="top"><div><b>JANSUVIDA</b><div id="welcome" class="muted">Customer Portal</div></div><div class="top-actions"><button class="btn out" onclick="location.href='customer-profile.html'">👤 My Profile</button><button class="btn out" id="logout">Logout</button></div></div><div class="card"><h2>My Profile</h2><div id="profile" class="profile"><div class="muted">Loading profile...</div></div></div><div class="card"><h2>Available Services</h2><div id="services" class="grid">Loading...</div><div id="msg"></div></div><div class="card"><h2>My Applications</h2><div id="apps" class="muted">Loading...</div></div><div class="card"><h2>My Payments</h2><div id="payments" class="muted">Loading...</div></div></div><script src="../assets/js/api.js"></script><script>const token=localStorage.getItem('jansuvida_access_token');const customer=JSON.parse(localStorage.getItem('jansuvida_customer')||'null');if(!token)location.href='login.html';document.getElementById('welcome').textContent=customer?'Welcome, '+customer.name:'Customer Portal';document.getElementById('logout').onclick=()=>{JansuvidaAPI.logout();location.href='login.html'};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function show(text){document.getElementById('msg').innerHTML='<div class="msg">'+text+'</div>'}async function profile(){try{const r=await fetch(JansuvidaAPI.base+'/profile',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Profile load failed');const c=d.customer;document.getElementById('profile').innerHTML='<div class="item"><div class="muted">Name</div><b>'+esc(c.name)+'</b></div><div class="item"><div class="muted">Mobile</div><b>'+esc(c.mobile)+'</b></div><div class="item"><div class="muted">Email</div><b>'+esc(c.email||'—')+'</b></div><div class="item"><div class="muted">Pincode</div><b>'+esc(c.pincode||'—')+'</b></div>';localStorage.setItem('jansuvida_customer',JSON.stringify(c))}catch(e){document.getElementById('profile').innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}async function load(){try{await profile();const s=await JansuvidaAPI.services();document.getElementById('services').innerHTML=s.services.map(x=>'<div class="service"><b>'+x.name+'</b><p class="muted">'+(x.description||'CSC service')+'</p><strong>₹'+Number(x.price).toFixed(2)+'</strong><br><button class="btn" style="margin-top:10px" onclick="apply('+x.id+')">Apply</button></div>').join('')||'<span class="muted">कोई service उपलब्ध नहीं।</span>';const a=await JansuvidaAPI.applications();document.getElementById('apps').innerHTML=a.applications.length?a.applications.map(x=>'<div class="row"><b>'+x.application_no+'</b> — '+x.service+' — <strong>'+x.status+'</strong><br><span class="muted">₹'+Number(x.price).toFixed(2)+' • '+x.created_at+'</span><div class="actions"><button class="btn" onclick="details(\''+encodeURIComponent(x.application_no)+'\')">View Details</button><button class="btn out" onclick="openUpload('+x.id+')">📎 Upload Documents</button><button class="btn out" onclick="pay('+x.id+')">Payment Request</button></div></div>').join(''):'अभी कोई application नहीं है।';const p=await JansuvidaAPI.payments();document.getElementById('payments').innerHTML=p.payments.length?p.payments.map(x=>'<div class="row"><b>'+x.application_no+'</b> — ₹'+Number(x.amount).toFixed(2)+' — '+x.method+' — <strong>'+x.status+'</strong><br><span class="muted">'+x.created_at+'</span></div>').join(''):'अभी कोई payment नहीं है।'}catch(e){show(e.message)}}function details(no){location.href='application-details.html?applicationNo='+no}function openUpload(id){location.href='upload-document.html?applicationId='+encodeURIComponent(id)}async function apply(id){try{const r=await JansuvidaAPI.createApplication({serviceId:id,details:{source:'customer-dashboard'}});show('Application बन गया: <b>'+r.application.applicationNo+'</b>');load()}catch(e){show(e.message)}}async function pay(id){const method=prompt('Payment method लिखें: upi या cash','upi');if(!method)return;try{const r=await JansuvidaAPI.createPayment({applicationId:id,method:method.toLowerCase()});show('Payment request बन गई: <b>#'+r.payment.id+'</b> — Status: pending');load()}catch(e){show(e.message)}}load();</script></body></html>
