<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0;color:#172033}.wrap{max-width:650px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}label{display:block;font-weight:700;margin:13px 0 6px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d6deea;border-radius:9px;font:inherit}textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:9px;padding:11px 15px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.out{background:#eef3fa;color:#172033}.muted{color:#697586;font-size:13px}.msg{margin-top:14px;padding:12px;border-radius:9px;background:#fff5d8}</style></head><body><div class="wrap"><div class="top"><div><b>JANSUVIDA</b><div class="muted">My Profile</div></div><button class="btn out" onclick="location.href='customer-dashboard.html'">Dashboard</button></div><div class="card"><h1>Customer Profile</h1><label>Name</label><input id="name"><label>Mobile</label><input id="mobile" inputmode="numeric" maxlength="10"><label>Email</label><input id="email" type="email"><label>Address</label><textarea id="address"></textarea><label>Pincode</label><input id="pincode" inputmode="numeric" maxlength="6"><br><br><button class="btn" id="save">Save Changes</button><div id="msg"></div></div></div><script src="../assets/js/api.js"></script><script>const token=localStorage.getItem('jansuvida_access_token');if(!token)location.href='login.html';const msg=document.getElementById('msg');async function api(path,options={}){const r=await fetch(JansuvidaAPI.base+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function set(c){for(const k of ['name','mobile','email','address','pincode'])document.getElementById(k).value=c[k]||''}async function load(){try{const d=await api('/profile');set(d.customer)}catch(e){msg.innerHTML='<div class="msg">'+e.message+'</div>'}}document.getElementById('save').onclick=async()=>{try{const body={name:name.value,mobile:mobile.value,email:email.value,address:address.value,pincode:pincode.value};const d=await api('/profile',{method:'PATCH',body:JSON.stringify(body)});localStorage.setItem('jansuvida_customer',JSON.stringify(d.customer));msg.innerHTML='<div class="msg">Profile successfully update हो गई।</div>'}catch(e){msg.innerHTML='<div class="msg">'+e.message+'</div>'}};load();</script></body></html>
