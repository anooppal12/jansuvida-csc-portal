<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="section"><div class="container" style="max-width:760px"><div class="portal-card"><a class="brand" href="customer.html"><span class="brand-mark">J</span><span><strong>JANSUVIDA</strong><small>Customer Portal</small></span></a><div style="margin-top:28px"><span class="eyebrow">Document Center</span><h1 style="margin:0">दस्तावेज़ अपलोड करें</h1><p style="color:#667085">अपने आवेदन के लिए जरूरी documents चुनें और upload करें।</p></div><form id="docForm"><label style="display:block;font-size:13px;font-weight:700;margin:16px 0">Application Number<input id="appNo" required placeholder="JS-2026-000123" style="width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><label style="display:block;font-size:13px;font-weight:700;margin:16px 0">Document Type<select id="type" required style="width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"><option value="">चुनें</option><option>Aadhaar Card</option><option>PAN Card</option><option>Bank Passbook</option><option>Photo</option><option>Address Proof</option><option>Other</option></select></label><label style="display:block;font-size:13px;font-weight:700;margin:16px 0">File<input id="file" type="file" accept="image/*,.pdf" required style="display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><button class="btn btn-primary btn-lg" style="width:100%">Upload Document</button></form><div id="msg" hidden style="margin-top:20px;padding:15px;background:#eef7f2;border:1px solid #cce9da;border-radius:12px;color:#16704c"></div><div id="list" style="margin-top:24px"></div></div></div></main><script>if(!localStorage.getItem('jansuvida_customer'))location.href='login.html';const key='jansuvida_documents';function render(){const d=JSON.parse(localStorage.getItem(key)||'[]');document.getElementById('list').innerHTML=d.length?'<h3>Uploaded Documents</h3>'+d.map(x=>'<div style="padding:12px;border:1px solid #e5ebf4;border-radius:10px;margin:8px 0"><b>'+x.type+'</b> — '+x.name+'<br><small>Application: '+x.appNo+' • '+x.date+'</small></div>').join(''):''}document.getElementById('docForm').addEventListener('submit',e=>{e.preventDefault();const f=document.getElementById('file').files[0];const d=JSON.parse(localStorage.getItem(key)||'[]');d.push({appNo:document.getElementById('appNo').value,type:document.getElementById('type').value,name:f.name,date:new Date().toLocaleString('en-IN')});localStorage.setItem(key,JSON.stringify(d));const m=document.getElementById('msg');m.hidden=false;m.textContent='Document upload entry दर्ज हो गई। Real server storage अगला backend चरण है।';e.target.reset();render()});render();</script></body></html>
