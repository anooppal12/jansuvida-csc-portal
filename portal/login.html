<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="section"><div class="container" style="max-width:520px"><div class="portal-card"><a class="brand" href="../index.html"><span class="brand-mark">J</span><span><strong>JANSUVIDA</strong><small>Customer Portal</small></span></a><div style="margin-top:30px"><span class="eyebrow">Customer Portal</span><h1 style="margin:0">Login</h1><p style="color:#667085">अपने registered mobile number और password से portal में प्रवेश करें।</p></div><form id="loginForm"><label style="display:block;font-size:13px;font-weight:700;margin:18px 0">मोबाइल नंबर<input id="mobile" type="tel" maxlength="10" pattern="[0-9]{10}" required placeholder="10 digit mobile number" style="width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><label style="display:block;font-size:13px;font-weight:700;margin:18px 0">Password<input id="password" type="password" minlength="8" required style="width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><button class="btn btn-primary btn-lg" style="width:100%" type="submit">Login →</button></form><p id="msg" style="font-size:13px;color:#b54708;margin-top:18px"></p><p style="text-align:center;font-size:13px;color:#667085">नया ग्राहक? <a href="register.html">Register करें</a></p></div></div></main><script src="../assets/js/api.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Login हो रहा है...';try{await JansuvidaAPI.login({mobile:document.getElementById('mobile').value.trim(),password:document.getElementById('password').value});location.href='customer-dashboard.html'}catch(err){msg.textContent=err.message}});</script></body></html>
