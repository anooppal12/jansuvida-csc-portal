<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="section"><div class="container" style="max-width:520px"><div class="portal-card"><a class="brand" href="../index.html"><span class="brand-mark">J</span><span><strong>JANSUVIDA</strong><small>Customer Portal</small></span></a><div style="margin-top:30px"><span class="eyebrow">Create Account</span><h1 style="margin:0">Customer Registration</h1><p style="color:#667085">Portal पर account बनाकर अपनी online services manage करें।</p></div><form id="registerForm"><label style="display:block;font-size:13px;font-weight:700;margin:16px 0">पूरा नाम<input name="name" required maxlength="120" placeholder="अपना नाम" style="width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><label style="display:block;font-size:13px;font-weight:700;margin:16px 0">मोबाइल नंबर<input name="mobile" type="tel" maxlength="10" pattern="[6-9][0-9]{9}" required placeholder="10 digit mobile number" style="width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><label style="display:block;font-size:13px;font-weight:700;margin:16px 0">Email (वैकल्पिक)<input name="email" type="email" placeholder="name@example.com" style="width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><label style="display:block;font-size:13px;font-weight:700;margin:16px 0">Password<input name="password" type="password" minlength="8" required placeholder="कम से कम 8 characters" style="width:100%;margin-top:7px;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit"></label><button class="btn btn-primary btn-lg" style="width:100%;margin-top:10px" type="submit">Create Account →</button></form><p id="msg" style="font-size:13px;margin-top:18px"></p><p style="text-align:center;font-size:13px;color:#667085">पहले से account है? <a href="login.html">Login करें</a></p></div></div></main><script src="../assets/js/api.js"></script><script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('msg');msg.textContent='Account बनाया जा रहा है...';msg.style.color='#667085';try{await JansuvidaAPI.register({name:String(f.get('name')).trim(),mobile:String(f.get('mobile')).trim(),email:String(f.get('email')).trim(),password:String(f.get('password'))});msg.textContent='Registration सफल हुआ। अब Login करें।';msg.style.color='#067647';setTimeout(()=>location.href='login.html',800)}catch(err){msg.textContent=err.message;msg.style.color='#b42318'}});</script></body></html>
