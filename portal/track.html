<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Application | Jansuvida</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#f5f8fd}.track{max-width:680px;margin:auto}.box{background:#fff;border:1px solid #e4eaf3;border-radius:18px;padding:25px}.search{display:flex;gap:10px}.search input{flex:1;padding:13px;border:1px solid #d8e0eb;border-radius:10px;font:inherit}.result{margin-top:22px}.status{padding:6px 10px;border-radius:99px;background:#fff3d6;color:#946200;font-size:11px;font-weight:800}.status.approved,.status.completed{background:#e7f8ef;color:#16704c}.status.rejected{background:#ffe9ec;color:#b42318}.step{display:flex;gap:14px;margin:16px 0}.dot{width:12px;height:12px;border-radius:50%;background:#d9e0ea;margin-top:4px}.dot.done{background:#176ce9}.muted{color:#718096}</style></head><body><main class="section"><div class="container track"><div class="box"><a class="brand" href="../index.html"><span class="brand-mark">J</span><span><strong>JANSUVIDA</strong><small>Application Tracking</small></span></a><div style="margin-top:28px"><span class="eyebrow">Track Your Application</span><h1 style="margin:0">आवेदन की स्थिति देखें</h1><p class="muted">Application Number डालकर current status देखें।</p></div><div class="search"><input id="no" placeholder="जैसे JS-2026-123456"><button id="search" class="btn btn-primary">Track</button></div><div id="result" class="result"></div></div></div></main><script>const r=document.getElementById('result');function track(){const no=document.getElementById('no').value.trim();const apps=JSON.parse(localStorage.getItem('jansuvida_applications')||'[]');const a=apps.find(x=>x.application_no.toLowerCase()===no.toLowerCase());if(!a){r.innerHTML='<div style="padding:15px;background:#fff1f2;color:#b42318;border-radius:10px">Application नहीं मिली। Number सही डालें।</div>';return}const stages=['pending','processing','approved','completed'];const idx=stages.indexOf(a.status);r.innerHTML='<div class="box" style="margin-top:0"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>'+a.service+'</b><br><small class="muted">'+a.application_no+' • '+a.date+'</small></div><span class="status '+a.status+'">'+a.status+'</span></div><hr style="border:0;border-top:1px solid #edf1f6;margin:18px 0">'+stages.map((s,i)=>'<div class="step"><span class="dot '+(i<=idx?'done':'')+'"></span><div><b>'+s.charAt(0).toUpperCase()+s.slice(1)+'</b><br><small class="muted">'+(i<=idx?'Completed/Reached':'Pending')+'</small></div></div>').join('')+'</div>'}document.getElementById('search').onclick=track;document.getElementById('no').onkeydown=e=>{if(e.key==='Enter')track()};const q=new URLSearchParams(location.search).get('no');if(q){document.getElementById('no').value=q;track()}</script></body></html>
