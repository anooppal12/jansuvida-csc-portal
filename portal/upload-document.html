<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Documents | Jansuvida</title><style>body{font-family:system-ui,Arial;background:#f5f8fd;margin:0;color:#172033}.wrap{max-width:700px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:22px;margin-bottom:18px}label{display:block;font-weight:700;margin:14px 0 7px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6deea;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:11px 15px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.muted{color:#697586;font-size:13px}.msg{margin-top:14px;padding:12px;border-radius:9px;background:#fff5d8}.row{padding:12px 0;border-bottom:1px solid #edf0f5}</style></head><body><div class="wrap"><div class="card"><h1>Document Upload</h1><p class="muted">Application के लिए अपना document select करके upload करें।</p><label>Application ID</label><input id="applicationId" type="number" min="1" required><label>Document Type</label><select id="type"><option value="aadhaar">Aadhaar</option><option value="pan">PAN</option><option value="bank_passbook">Bank Passbook</option><option value="photo">Photo</option><option value="address_proof">Address Proof</option><option value="other">Other</option></select><label>File</label><input id="file" type="file" accept="image/jpeg,image/png,application/pdf" required><p class="muted">PDF/JPG/PNG — अधिकतम file size server limit के अनुसार रखें।</p><button class="btn" id="upload">Upload Document</button><div id="msg"></div></div><div class="card"><h2>Application Documents</h2><button class="btn" id="refresh">Refresh</button><div id="list" class="muted" style="margin-top:12px">Application ID डालकर Refresh करें।</div></div></div><script src="../assets/js/api.js"></script><script>const token=localStorage.getItem('jansuvida_access_token');if(!token)location.href='login.html';const msg=document.getElementById('msg');async function api(path,options={}){const r=await fetch(JansuvidaAPI.base+path,{...options,headers:{Authorization:'Bearer '+token,...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}document.getElementById('upload').onclick=async()=>{const file=document.getElementById('file').files[0],applicationId=Number(document.getElementById('applicationId').value),type=document.getElementById('type').value;if(!file||!applicationId)return;msg.innerHTML='<div class="msg">Upload तैयार हो रहा है...</div>';try{const form=new FormData();form.append('file',file);form.append('applicationId',applicationId);form.append('type',type);const r=await fetch(JansuvidaAPI.base+'/documents/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:form});const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');msg.innerHTML='<div class="msg">Document successfully upload हुआ। Status: <b>'+d.document.status+'</b></div>';load()}catch(e){msg.innerHTML='<div class="msg">'+e.message+'</div>'}};async function load(){const id=Number(document.getElementById('applicationId').value);if(!id){document.getElementById('list').textContent='Application ID डालें।';return}try{const d=await api('/documents/application/'+id);document.getElementById('list').innerHTML=d.documents.length?d.documents.map(x=>'<div class="row"><b>'+x.document_type+'</b> — '+x.original_name+'<br><span class="muted">Status: '+x.status+(x.remarks?' • '+x.remarks:'')+'</span></div>').join(''):'कोई document नहीं मिला।'}catch(e){document.getElementById('list').textContent=e.message}}document.getElementById('refresh').onclick=load;</script></body></html>
